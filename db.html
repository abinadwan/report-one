<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قاعدة بيانات RetailPulse</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;700&display=swap" rel="stylesheet">

  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- CSS -->
  <link rel="stylesheet" href="db.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="light-mode">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="brand-logo"><i class="fas fa-database"></i></div>
      <h1 class="brand-title">RetailPulse</h1>
    </div>

    <nav class="sidebar-nav">
      <ul class="nav-list">
        <li class="nav-item active"><a href="#create-table" class="nav-link" data-target="create-table"><i class="fas fa-plus"></i> إنشاء جدول</a></li>
        <li class="nav-item"><a href="#manage-data" class="nav-link" data-target="manage-data"><i class="fas fa-table"></i> إدخال بيانات</a></li>
        <li class="nav-item"><a href="index.html" class="nav-link"><i class="fas fa-home"></i> لوحة التحكم</a></li>
      </ul>
    </nav>

    <div class="sidebar-footer">
      <div class="quick-links">
        <a href="#" class="quick-link" title="الإعدادات"><i class="fas fa-cog"></i></a>
        <a href="index.html" class="quick-link" title="عودة للوحة التحكم"><i class="fas fa-home"></i></a>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">

    <header class="top-header">
      <div class="header-left"><h2 class="page-title" id="pageTitle">إنشاء جدول</h2></div>
    </header>

    <div class="content-container">

      <!-- 1. إنشاء جدول -->
      <section id="create-table" class="active-section">
        <div class="card">
          <div class="card-header"><h3><i class="fas fa-plus"></i> ابدأ بإنشاء جدول جديد</h3></div>
          <div class="card-body">

            <div class="form-group">
              <label for="newTableName">اسم الجدول</label>
              <input type="text" id="newTableName" placeholder="مثلاً: المبيعات" required>
            </div>

            <hr>

            <h4>الأعمدة (الحقول)</h4>
            <div id="columnsContainer"></div>
            <button class="btn btn-primary add-column" id="addColumnBtn"><i class="fas fa-plus"></i> إضافة عمود</button>

            <hr>

            <button class="btn btn-success" id="saveTableBtn"><i class="fas fa-save"></i> حفظ الجدول</button>
          </div>
        </div>
      </section>

      <!-- 2. إدخال بيانات -->
      <section id="manage-data" class="hidden-section">
        <div class="card">
          <div class="card-header"><h3>إدخال بيانات في جدولك</h3></div>
          <div class="card-body">

            <div class="form-group">
              <label for="selectTable">اختر الجدول</label>
              <select id="selectTable"></select>
            </div>

            <div id="dataTableContainer" class="table-responsive"></div>
            <button class="btn btn-primary" id="addRowBtn"><i class="fas fa-plus"></i> إضافة صف</button>
          </div>
        </div>
      </section>

    </div>
  </main>

  <!-- Toast -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- JS -->
  <script src="db.js"></script>
  <script src="builder.js"></script>
</body>
</html>
